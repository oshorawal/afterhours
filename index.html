<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>A Very Important Question</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#129346;</text></svg>">
<style>
  :root{
    --ink:#171009; --panel:#221812; --panel-2:#2b1f15;
    --gold:#d4af54; --gold-bright:#eccb75; --gold-dim:#8a7135;
    --cream:#f4ead3; --cream-dim:#c9bca0; --blush:#e8a0a8;
    --body:Georgia,"Iowan Old Style",serif;
    --display:"Bodoni 72",Didot,"Playfair Display","Times New Roman",serif;
  }
  html{background:var(--ink)}
  body{
    margin:0; background:radial-gradient(120% 90% at 50% 0%, #2a1c10 0%, var(--ink) 60%);
    color:var(--cream); font-family:var(--body); line-height:1.6;
    min-height:100svh; display:flex; align-items:center; justify-content:center; padding:1.25rem;
  }
  .label{font-size:.72rem; letter-spacing:.22em; text-transform:uppercase; color:var(--gold)}
  .rule{display:flex; align-items:center; gap:.9rem; justify-content:center; margin:0}
  .rule::before,.rule::after{content:""; height:1px; width:3.2rem; background:var(--gold-dim)}
  .door{
    width:min(26rem,100%); text-align:center; box-sizing:border-box;
    border:1px solid var(--gold-dim); outline:1px solid var(--gold-dim); outline-offset:5px;
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
    padding:2.6rem 1.6rem 2.2rem; position:relative;
  }
  .door::before,.door::after{
    content:"\25C6"; color:var(--gold); font-size:.55rem; position:absolute; left:50%;
    transform:translateX(-50%);
  }
  .door::before{top:.6rem}.door::after{bottom:.6rem}
  .peep{font-size:2.2rem; line-height:1; margin-bottom:1rem}
  h1{
    font-family:var(--display); font-weight:400; color:var(--gold-bright);
    font-size:clamp(1.9rem,7vw,2.5rem); margin:.6rem 0 .4rem; letter-spacing:.02em;
  }
  .door p{color:var(--cream-dim); font-size:.95rem; margin:.2rem auto 1.4rem; max-width:20rem}
  form{display:flex; flex-direction:column; gap:.7rem; max-width:17rem; margin:0 auto}
  #pw{
    background:#140d07; border:1px solid var(--gold-dim); color:var(--cream);
    font-family:var(--body); font-size:1.05rem; text-align:center; letter-spacing:.12em;
    padding:.7rem .9rem; border-radius:2px;
  }
  #pw:focus{outline:2px solid var(--gold); outline-offset:2px}
  #knock{
    background:var(--gold); color:#241a08; border:none; cursor:pointer;
    font-family:var(--body); font-size:.8rem; letter-spacing:.24em; text-transform:uppercase;
    padding:.85rem 1rem; border-radius:2px;
  }
  #knock:hover{background:var(--gold-bright)}
  #knock:disabled{opacity:.6; cursor:wait}
  #knock:focus-visible{outline:2px solid var(--cream); outline-offset:2px}
  #doorman{min-height:2.6em; color:var(--blush); font-size:.9rem; font-style:italic; margin-top:1rem}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  @media (prefers-reduced-motion: reduce){.shake{animation:none}}
</style>
</head>
<body>
  <div class="door" id="door">
    <div class="peep" aria-hidden="true">&#129323;</div>
    <p class="label rule">Est. 2026 &middot; Members only</p>
    <h1>Password, please.</h1>
    <p>You've found a private establishment. The doorman is friendly but firm, and he's heard every trick.</p>
    <form id="gateform">
      <input id="pw" type="password" placeholder="whisper it&hellip;" autocomplete="off" aria-label="Password">
      <button id="knock" type="submit">Knock twice</button>
    </form>
    <p id="doorman" aria-live="polite"></p>
  </div>

  function b2a(b64){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
